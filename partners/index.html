        <!-- Title -->
        <title>Создание сайтов в Грозном | Поддержка и SEO продвижение GrozNet</title>

        <!-- Favicon and Icons -->
        <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
        <link rel="apple-touch-icon" href="/assets/images/logo200x200.png">

        <!-- Manifest -->
        <link rel="manifest" href="manifest.json">

        <script src="/assets/js/tailwind.js"></script>

            <meta http-equiv="refresh" content="0; url=/noscript.html">

        <script>
            tailwind.config = {
                theme: {
                    container: {
                        center: true,
                        padding: '16px',
                        screens: {
                            DEFAULT: '1280px'
                        }
                    },
                    extend: {
                        fontFamily: {
                            serif: ['serif'],
                            sans: ['Arial', 'Helvetica', 'sans-serif']
                        }
                    }
                },
                corePlugins: {
                    preflight: true
                }
            }
        </script> 
    </head>
    <body>
        <header id="header"></header>
        <!-- End Header -->

        <section id="partners-hero-section" class="py-6 md:py-8 bg-neutral-50 dark:bg-neutral-950 border-b border-neutral-200/50 dark:border-neutral-900 transition-colors duration-300">
            <div class="container mx-auto">
                <div class="flex flex-col space-y-4">
                    
                    <nav class="flex items-center space-x-2 text-xs md:text-sm font-medium text-neutral-500 dark:text-neutral-400">
                        <a href="/" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-200 flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                            </svg>
                            Главная
                        </a>
                        
                        <span class="text-neutral-300 dark:text-neutral-700 select-none">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
                        </span>
                        
                        <span class="text-neutral-700 dark:text-neutral-200 font-semibold">Партнеры</span>
                    </nav>

                    <div class="space-y-2">
                        <h1 class="text-3xl md:text-4xl font-serif font-bold text-neutral-700 dark:text-white tracking-tight">
                            Наши Партнеры
                        </h1>
                        <div class="h-1 w-12 bg-blue-600 rounded-full"></div>
                    </div>

                </div>
            </div>
        </section>

        <section
            x-data="partnersSection()"
            x-init="loadPartners()"
            class="py-16 dark:bg-neutral-950 transition-colors duration-300"
        >
            <div class="container mx-auto px-4">

                <div x-show="loading" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="h-28 rounded-2xl bg-neutral-200 dark:bg-neutral-800 animate-pulse"></div>
                    <div class="h-28 rounded-2xl bg-neutral-200 dark:bg-neutral-800 animate-pulse"></div>
                    <div class="h-28 rounded-2xl bg-neutral-200 dark:bg-neutral-800 animate-pulse"></div>
                    <div class="h-28 rounded-2xl bg-neutral-200 dark:bg-neutral-800 animate-pulse"></div>
                </div>

                <div
                    x-show="!loading"
                    style="display: none;"
                    class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6"
                >
                    <template x-for="(partner, index) in partners" :key="index">
                        <a
                            :href="partner.url || '#'"
                            :target="partner.url ? '_blank' : '_self'"
                            class="flex items-center justify-center p-3 bg-white dark:bg-neutral-900 rounded-md min-h-[120px] border border-neutral-100 dark:border-neutral-800 shadow-sm hover:shadow-md transition duration-300"
                        >
                            <img
                                :src="partner.logo"
                                :alt="partner.name"
                                class="max-h-12 max-w-[80%] object-contain opacity-70 hover:opacity-100 transition"
                            />
                        </a>
                    </template>
                </div>

            </div>
        </section>

        <script>
        function partnersSection() {
            return {
                partners: [],
                loading: true,

                async loadPartners() {
                    try {
                        const res = await fetch('/data/partners.json')
                        if (!res.ok) throw new Error('HTTP ' + res.status)

                        const data = await res.json()
                        // Гарантируем глубокое копирование массива для триггера реактивности Alpine
                        this.partners = Array.isArray(data.partners) ? [...data.partners] : []
                    } catch (e) {
                        console.error(e)
                        this.partners = []
                    } finally {
                        this.loading = false
                    }
                }
            }
        }
        </script>

        <!-- Footer -->
        <footer id="footer" class="bg-neutral-50 dark:bg-neutral-950 text-neutral-500 dark:text-neutral-400 text-[13px] pt-16 pb-8 border-t border-neutral-200/50 dark:border-neutral-900 transition-colors duration-300"></footer>
        <!-- Footer -->
        <script src="https://kit.fontawesome.com/1b1dcc9abc.js" crossorigin="anonymous"></script>
        <script src="/assets/js/main.js"></script>
        <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    </body>
</html>
