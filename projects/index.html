<!DOCTYPE html>
<html lang="ru">
    <head>
        <!-- Meta Tags for Character Set and Responsiveness -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <!-- Meta Tags for SEO -->
        <meta name="description" content="Создание сайтов в Грозном Веб-студия GrozNet. Поддержка и SEO продвижение сайтов, интернет-магазинов реклама 8(929)888-33-27">
        <meta name="keywords" content="Создание сайтов в Грозном, разработка сайтов Грозный, техподдержка, интернет-магазины, реклама">
        <meta name="author" content="Керим Тимирбулатов">

        <!-- Title -->
        <title>Создание сайтов в Грозном | Поддержка и SEO продвижение GrozNet</title>

        <!-- Favicon and Icons -->
        <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
        <link rel="apple-touch-icon" href="/assets/images/logo200x200.png">

        <!-- Manifest -->
        <link rel="manifest" href="manifest.json">

        <script src="/assets/js/tailwind.js"></script>
        
        <noscript>
            <meta http-equiv="refresh" content="0; url=/noscript.html">
        </noscript>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script type="text/javascript">!function(e,t,c,n,r,a,m){e.ym=e.ym||function(){(e.ym.a=e.ym.a||[]).push(arguments)},e.ym.l=1*new Date;for(var s=0;s<document.scripts.length;s++)if(document.scripts[s].src===n)return;a=t.createElement(c),m=t.getElementsByTagName(c)[0],a.async=1,a.src=n,m.parentNode.insertBefore(a,m)}(window,document,"script","https://mc.yandex.ru/metrika/tag.js"),ym(95233076,"init",{clickmap:!0,trackLinks:!0,accurateTrackBounce:!0})</script>
        <noscript>
            <div><img src="https://mc.yandex.ru/watch/95233076" style="position:absolute;left:-9999px" alt=""></div>
        </noscript>
        <script>
            tailwind.config = {
                theme: {
                    container: {
                        center: true,
                        padding: '16px',
                        screens: {
                            DEFAULT: '1280px'
                        }
                    },
                    extend: {
                        fontFamily: {
                            serif: ['serif'],
                            sans: ['Arial', 'Helvetica', 'sans-serif']
                        }
                    }
                },
                corePlugins: {
                    preflight: true
                }
            }
        </script> 
    </head>
    <body>
        <header id="header"></header>
        <!-- End Header -->

        <section id="portfolio-breadcrumb-section" class="py-6 md:py-8 bg-neutral-50 dark:bg-neutral-950 border-b border-neutral-200/50 dark:border-neutral-900 transition-colors duration-300">
            <div class="container mx-auto">
                <div class="flex flex-col space-y-4">
                    
                    <nav class="flex items-center space-x-2 text-xs md:text-sm font-medium text-neutral-500 dark:text-neutral-400">
                        <a href="/" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-200 flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                            </svg>
                            Главная
                        </a>
                        
                        <span class="text-neutral-300 dark:text-neutral-700 select-none">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
                        </span>
                        
                        <span class="text-neutral-700 dark:text-neutral-200 font-semibold">Портфолио</span>
                    </nav>

                    <div class="space-y-2">
                        <h1 class="text-3xl md:text-4xl font-serif font-bold text-neutral-700 dark:text-white tracking-tight">
                            Наши Проекты
                        </h1>
                        <div class="h-1 w-12 bg-blue-600 rounded-full"></div>
                    </div>

                </div>
            </div>
        </section>

        <section id="all-projects-section" class="py-10 md:py-16 dark:bg-neutral-950 transition-colors duration-300"
                x-data="{
                    activeFilter: 'all-projects',
                    categories: [],
                    projects: [],
                    isLoading: true,
                    init() {
                        fetch('/data/portfolio.json')
                            .then(res => res.json())
                            .then(data => {
                                this.categories = data.categories;
                                this.projects = data.projects;
                                this.isLoading = false;
                            })
                            .catch(err => console.error('Ошибка загрузки портфолио:', err));
                    },
                    get filteredProjects() {
                        if (this.activeFilter === 'all-projects') {
                            return [...this.projects].reverse();
                        }
                        return [...this.projects].filter(p => p.category === this.activeFilter).reverse();
                    }
                }">
            <div class="container mx-auto">
                
                <div class="flex flex-col lg:flex-row lg:items-end justify-between mb-16 gap-6">
                    <!-- Измененный блок: лаконичное описание вместо дублирующего h1 -->
                    <div class="space-y-2 max-w-md">
                        <span class="text-xs font-bold tracking-widest uppercase text-blue-600 dark:text-blue-400">Фильтр работ</span>
                        <p class="text-neutral-600 dark:text-neutral-400 text-sm leading-relaxed">
                            Используйте переключатели справа, чтобы отсортировать выполненные проекты по интересующим вас категориям разработки.
                        </p>
                    </div>
                    
                    <!-- Кнопки фильтрации (остаются без изменений) -->
                    <div class="flex flex-wrap gap-2 bg-neutral-200/60 dark:bg-neutral-900/40 p-1.5 rounded-xl border border-neutral-200/10" x-show="!isLoading">
                        <template x-for="filter in categories" :key="filter.id">
                            <button @click="activeFilter = filter.id"
                                    :class="activeFilter === filter.id 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white'"
                                    class="px-5 py-2 text-sm font-medium rounded-lg transition-all duration-200 whitespace-nowrap"
                                    x-text="filter.title">
                            </button>
                        </template>
                    </div>
                </div>

                <div x-show="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <div class="animate-pulse bg-neutral-200 dark:bg-neutral-800 aspect-video rounded-2xl"></div>
                    <div class="animate-pulse bg-neutral-200 dark:bg-neutral-800 aspect-video rounded-2xl hidden md:block"></div>
                    <div class="animate-pulse bg-neutral-200 dark:bg-neutral-800 aspect-video rounded-2xl hidden lg:block"></div>
                </div>

                <div x-show="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <template x-for="project in filteredProjects" :key="project.title">
                        <div x-transition:enter="transition ease-out duration-300"
                            x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                            class="group relative overflow-hidden rounded-2xl border border-neutral-200/60 dark:border-neutral-800/60 bg-white dark:bg-neutral-900 shadow-sm hover:shadow-xl dark:hover:shadow-neutral-950/40 transition-all duration-300 flex flex-col justify-between">
                            
                            <div>
                                <div class="aspect-video w-full overflow-hidden bg-neutral-100 dark:bg-neutral-800 relative">
                                    <img :alt="project.title" :src="project.image" class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-103">
                                    
                                    <div class="absolute inset-0 bg-gradient-to-t from-neutral-950/80 via-neutral-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
                                        <a :href="project.url" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-xl shadow-md transition">
                                            Посетить сайт
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-3.75 3.75M21 12H3" /></svg>
                                        </a>
                                    </div>
                                </div>

                                <div class="p-6">
                                    <span class="text-xs font-bold text-blue-600 dark:text-blue-400 tracking-wider uppercase" 
                                        x-text="categories.find(c => c.id === project.category)?.title"></span>
                                    
                                    <h3 class="text-lg font-serif font-bold text-neutral-900 dark:text-white mt-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-200">
                                        <a :href="project.url" target="_blank" rel="noopener" x-text="project.title" class="focus:outline-none"></a>
                                    </h3>
                                    
                                    <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-2 leading-relaxed" 
                                    x-text="project.description"></p>
                                </div>
                            </div>

                        </div>
                    </template>
                </div>

            </div>
        </section>    

        <footer id="footer" class="bg-neutral-50 dark:bg-neutral-950 text-neutral-500 dark:text-neutral-400 text-[13px] pt-16 pb-8 border-t border-neutral-200/50 dark:border-neutral-900 transition-colors duration-300"></footer>
        <!-- Footer -->
        <script src="https://kit.fontawesome.com/1b1dcc9abc.js" crossorigin="anonymous"></script>
        <script src="/assets/js/main.js"></script>
        <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    </body>
</html>
